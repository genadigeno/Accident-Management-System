apiVersion: v1
kind: Service
metadata:
  name: accident-event-stream
  labels:
    app: accident-event-stream
spec:
  selector:
    app: accident-event-stream
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accident-event-stream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accident-event-stream
  template:
    metadata:
      labels:
        app: accident-event-stream
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      # Pre-create the topics at RF=1 (min.insync.replicas=1) so the app's replicas(3) topic beans
      # find them already present and no-op — lets the unchanged app run on single-node Kafka.
      initContainers:
        - name: create-topics
          image: confluentinc/cp-kafka:7.4.0
          command: ["bash", "-c"]
          args:
            - |
              set -e
              echo "waiting for kafka..."
              until kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 3; done
              for t in accident.events emergency.events law-enforcement.events \
                       fire-rescue.events statistics.events accident.events.sensitive \
                       accident.events.fraud unit.status.events bolo.alerts sla.alerts \
                       incident.events accident.events.enriched; do
                kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
                  --topic "$t" --partitions 3 --replication-factor 1 --config min.insync.replicas=1
              done
              for t in accident.events.dlt emergency.events.dlt law-enforcement.events.dlt \
                       fire-rescue.events.dlt statistics.events.dlt dispatch.events.dlt \
                       notification.events.dlt correlation.events.dlt search.events.dlt \
                       enrichment.events.dlt; do
                kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
                  --topic "$t" --partitions 1 --replication-factor 1 --config min.insync.replicas=1
              done
              echo "topics ready"
      containers:
        - name: accident-event-stream
          image: ams/accident-event-stream:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ams-config
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: STATE_DIRECTORY, value: "/tmp/kafka-streams" }
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
