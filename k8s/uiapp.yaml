apiVersion: v1
kind: Service
metadata:
  name: uiapp
  labels:
    app: uiapp
spec:
  selector:
    app: uiapp
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uiapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uiapp
  template:
    metadata:
      labels:
        app: uiapp
    spec:
      containers:
        - name: uiapp
          image: ams/uiapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: ams-config
          env:
            - { name: SERVER_PORT, value: "9000" }
            # Active health-poll the in-cluster services by their Service DNS names.
            - { name: ROUTER_URL, value: "http://accident-event-stream:8080" }
            - { name: EMERGENCY_URL, value: "http://emergency-service:18089" }
            - { name: LAW_ENFORCEMENT_URL, value: "http://law-enforcement-service:28089" }
            - { name: FIRERESCUE_URL, value: "http://firerescue-service:38089" }
            - { name: STATISTICS_URL, value: "http://statistics-service:48089" }
            - { name: DISPATCH_URL, value: "http://dispatch-service:8087" }
            - { name: NOTIFICATION_URL, value: "http://notification-service:8088" }
            - { name: CORRELATION_URL, value: "http://incident-correlation-service:8089" }
            - { name: GATEWAY_URL, value: "http://citizen-report-gateway:8090" }
            - { name: SEARCH_URL, value: "http://search-service:8091" }
            - { name: ENRICHMENT_URL, value: "http://enrichment-service:8092" }
          # The uiapp has no actuator; the home page is its readiness signal.
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              memory: "768Mi"
