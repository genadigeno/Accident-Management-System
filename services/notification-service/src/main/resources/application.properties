# ============================================================
#  Notification Service — base configuration
#  Environment-specific overrides live in:
#    application-dev.properties   (default)
#    application-prod.properties  (SPRING_PROFILES_ACTIVE=prod)
# ============================================================
spring.application.name=notification-service
server.port=${SERVER_PORT:60089}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Kafka (consumer) ----------
spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.key-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true

# ---------- Kafka (producer: dead-letter topic) ----------
spring.kafka.producer.key-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# ---------- Schema Registry ----------
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# ---------- Topics (alert fan-in) ----------
kafka.bolo-alerts.topic=${BOLO_ALERTS_TOPIC_NAME:bolo.alerts}
kafka.sla-alerts.topic=${SLA_ALERTS_TOPIC_NAME:sla.alerts}
kafka.fraud-alerts.topic=${FRAUD_TOPIC_NAME:accident.events.fraud}
kafka.sensitive-alerts.topic=${SENSITIVE_TOPIC_NAME:accident.events.sensitive}
kafka.main.topic-dlt=${DLT_TOPIC_NAME:notification.events.dlt}

# ---------- Notification behaviour ----------
# Max notifications per SOURCE per minute that reach the channels; the rest are recorded
# but marked rate-limited (an alert storm must not melt the channels).
notification.rate-limit-per-minute=${NOTIFICATION_RATE_LIMIT:30}
# Webhook channel: enabled when a URL is set (POSTs each notification as JSON).
#notification.webhook.url=${NOTIFICATION_WEBHOOK_URL:}
notification.webhook.timeout-ms=${NOTIFICATION_WEBHOOK_TIMEOUT_MS:3000}

# ---------- Datasource (PostgreSQL) ----------
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/accident_management_service}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:test}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:15}
spring.datasource.hikari.pool-name=notification-jpa-pool

# ---------- JPA / Hibernate (profile-independent) ----------
spring.jpa.open-in-view=false
spring.transaction.rollback-on-commit-failure=true

# ---------- Database migrations (Flyway owns the schema) ----------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---------- Actuator / management ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ---------- Logging ----------
logging.level.root=INFO
