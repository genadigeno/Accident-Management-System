# ============================================================
#  Enrichment Service — base configuration
#  Environment-specific overrides live in:
#    application-dev.properties   (default)
#    application-prod.properties  (SPRING_PROFILES_ACTIVE=prod)
# ============================================================
spring.application.name=enrichment-service
server.port=${SERVER_PORT:8092}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Kafka (consumer) ----------
spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
# Enrichment is forward-looking (augments new events), so start at the tip — no backlog replay,
# no flooding the weather API.
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.key-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true

# ---------- Kafka (producer: enriched events + dead-letter topic) ----------
spring.kafka.producer.key-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# ---------- Schema Registry ----------
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# ---------- Topics ----------
kafka.source.topic=${SOURCE_TOPIC_NAME:accident.events}
kafka.enriched.topic=${ENRICHED_TOPIC_NAME:accident.events.enriched}
kafka.main.topic-dlt=${DLT_TOPIC_NAME:enrichment.events.dlt}

# ---------- Weather (Open-Meteo, free, no API key) ----------
weather.open-meteo.url=${OPEN_METEO_URL:https://api.open-meteo.com/v1/forecast}
weather.open-meteo.connect-timeout-ms=${OPEN_METEO_CONNECT_TIMEOUT_MS:2000}
weather.open-meteo.read-timeout-ms=${OPEN_METEO_READ_TIMEOUT_MS:3000}
# Dev-only escape hatch for TLS-intercepting proxies (see the maven ssl.insecure workaround).
weather.open-meteo.insecure-tls=${OPEN_METEO_INSECURE_TLS:false}

# ---------- Actuator / management ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ---------- Logging ----------
logging.level.root=INFO
