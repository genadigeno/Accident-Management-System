# ============================================================
#  Dispatch Service — base configuration
#  Environment-specific overrides live in:
#    application-dev.properties   (default)
#    application-prod.properties  (SPRING_PROFILES_ACTIVE=prod)
# ============================================================
spring.application.name=dispatch-service
server.port=${SERVER_PORT:58089}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Kafka (consumer) ----------
spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.key-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true

# ---------- Kafka (producer: unit.status.events + dead-letter topic) ----------
spring.kafka.producer.key-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# ---------- Schema Registry ----------
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# ---------- Topics ----------
kafka.topic.emergency=${EMERGENCY_TOPIC_NAME:emergency.events}
kafka.topic.law-enforcement=${LAW_ENFORCEMENT_TOPIC_NAME:law-enforcement.events}
kafka.topic.fire-rescue=${FIRE_RESCUE_TOPIC_NAME:fire-rescue.events}
kafka.topic.unit-status=${UNIT_STATUS_TOPIC_NAME:unit.status.events}
kafka.main.topic-dlt=${DLT_TOPIC_NAME:dispatch.events.dlt}

# ---------- Dispatch behaviour ----------
# Simulator: advances DISPATCHED -> EN_ROUTE -> ON_SCENE -> CLEARED with randomized timings,
# standing in for real units reporting status. Disable when real units feed unit.status.events.
dispatch.simulator.enabled=${DISPATCH_SIM_ENABLED:true}
dispatch.simulator.tick-ms=${DISPATCH_SIM_TICK_MS:2000}
# Call stacking: how often WAITING dispatches retry to grab a freed-up unit.
dispatch.stacking.retry-ms=${DISPATCH_STACKING_RETRY_MS:3000}

# ---------- Datasource (PostgreSQL) ----------
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/accident_management_service}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:test}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:15}
spring.datasource.hikari.pool-name=dispatch-jpa-pool

# ---------- JPA / Hibernate (profile-independent) ----------
spring.jpa.open-in-view=false
spring.transaction.rollback-on-commit-failure=true

# ---------- Database migrations (Flyway owns the schema) ----------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---------- Actuator / management ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ---------- Logging ----------
logging.level.root=INFO
