# ============================================================
#  Incident Correlation Service — base configuration
#  Environment-specific overrides live in:
#    application-dev.properties   (default)
#    application-prod.properties  (SPRING_PROFILES_ACTIVE=prod)
# ============================================================
spring.application.name=incident-correlation-service
server.port=${SERVER_PORT:8089}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Kafka (consumer) ----------
spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.key-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true

# ---------- Kafka (producer: incident.events + dead-letter topic) ----------
spring.kafka.producer.key-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# ---------- Schema Registry ----------
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# ---------- Topics ----------
kafka.source.topic=${SOURCE_TOPIC_NAME:accident.events}
kafka.incident.topic=${INCIDENT_TOPIC_NAME:incident.events}
kafka.main.topic-dlt=${DLT_TOPIC_NAME:correlation.events.dlt}

# ---------- Correlation behaviour ----------
# Reports of the same type within a ~150m grid-cell neighbourhood merge into one incident while
# the incident received a report within the window; an incident idle longer than
# close-after-minutes is closed automatically.
correlation.window-minutes=${CORRELATION_WINDOW_MINUTES:10}
correlation.close-after-minutes=${CORRELATION_CLOSE_MINUTES:30}
correlation.close-check-ms=${CORRELATION_CLOSE_CHECK_MS:30000}

# ---------- Datasource (PostgreSQL) ----------
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/accident_management_service}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:test}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:15}
spring.datasource.hikari.pool-name=correlation-jpa-pool

# ---------- JPA / Hibernate (profile-independent) ----------
spring.jpa.open-in-view=false
spring.transaction.rollback-on-commit-failure=true

# ---------- Database migrations (Flyway owns the schema) ----------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---------- Actuator / management ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ---------- Logging ----------
logging.level.root=INFO
