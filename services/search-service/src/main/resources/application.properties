# ============================================================
#  Search Service — base configuration
#  Environment-specific overrides live in:
#    application-dev.properties   (default)
#    application-prod.properties  (SPRING_PROFILES_ACTIVE=prod)
# ============================================================
spring.application.name=search-service
server.port=${SERVER_PORT:8091}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Kafka (consumer) ----------
spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.key-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true

# ---------- Kafka (producer: dead-letter topic) ----------
spring.kafka.producer.key-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# ---------- Schema Registry ----------
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# ---------- Topics ----------
kafka.source.topic=${SOURCE_TOPIC_NAME:accident.events}
kafka.main.topic-dlt=${DLT_TOPIC_NAME:search.events.dlt}

# ---------- Elasticsearch ----------
# Plain HTTP to the ES cluster (the project's ES runs with security disabled). Point at any
# reachable node; index name is created on startup with a geo_point mapping if missing.
elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
elasticsearch.index=${ELASTICSEARCH_INDEX:ams-incidents}
elasticsearch.connect-timeout-ms=${ES_CONNECT_TIMEOUT_MS:3000}
elasticsearch.read-timeout-ms=${ES_READ_TIMEOUT_MS:10000}

# ---------- Actuator / management ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ---------- Logging ----------
logging.level.root=INFO
