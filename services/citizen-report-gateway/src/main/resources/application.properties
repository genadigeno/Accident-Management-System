# ============================================================
#  Citizen Report Gateway — base configuration
# ============================================================
spring.application.name=citizen-report-gateway
server.port=${SERVER_PORT:8090}

# ---------- Kafka (producer only) ----------
spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.producer.key-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.acks=all

# ---------- Schema Registry ----------
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# ---------- Topics ----------
kafka.source.topic=${SOURCE_TOPIC_NAME:accident.events}

# ---------- Gateway behaviour ----------
# Comma-separated API keys for the X-API-Key header; EMPTY disables the gate (dev only!).
gateway.api-keys=${GATEWAY_API_KEYS:}
# Max reports per reporter (api key, else client address) per minute.
gateway.rate-limit-per-minute=${GATEWAY_RATE_LIMIT:10}
# Correlation service for the duplicate hint (best-effort; blank disables the hint).
gateway.correlation.url=${GATEWAY_CORRELATION_URL:http://localhost:8089}
gateway.correlation.timeout-ms=${GATEWAY_CORRELATION_TIMEOUT_MS:1000}

# ---------- Actuator / management ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ---------- Logging ----------
logging.level.root=INFO
