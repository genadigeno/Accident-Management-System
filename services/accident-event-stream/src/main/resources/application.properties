# ============================================================
#  Accident Event Stream (router) — base configuration
#  Environment-specific overrides live in:
#    application-dev.properties   (default)
#    application-prod.properties  (SPRING_PROFILES_ACTIVE=prod)
# ============================================================
spring.application.name=accident-data-stream
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Kafka Streams ----------
spring.kafka.streams.application-id=${spring.application.name}
spring.kafka.streams.bootstrap-servers=${BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.streams.state-store-cache-max-size=${STATE_STORE_CACHE_MAX_SIZE:0}
spring.kafka.streams.state-dir=${STATE_DIRECTORY:./state-dir}
spring.kafka.streams.properties.processing.guarantee=exactly_once_v2

# ---------- Kafka (producer, used for the dead-letter topic) ----------
spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.producer.key-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# ---------- Schema Registry ----------
specific.avro.reader.value.subject.version=${AVRO_SUBJECT_VERSION:latest}
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# ---------- Topics ----------
topic.config.source=${SOURCE_TOPIC_NAME:accident.events}
topic.config.source.dlt=${DLT_SOURCE_TOPIC_NAME:accident.events.dlt}
topic.config.emergency=${EMERGENCY_SERVICE_TOPIC_NAME:emergency.events}
topic.config.law-enforcement=${POLICE_SERVICE_TOPIC_NAME:law-enforcement.events}
topic.config.fire-rescue=${FIRE_RESCUE_SERVICE_TOPIC_NAME:fire-rescue.events}
topic.config.statistics=${STATISTICS_SERVICE_TOPIC_NAME:statistics.events}
topic.config.sensitive=${SENSITIVE_TOPIC_NAME:accident.events.sensitive}
topic.config.fraud=${FRAUD_TOPIC_NAME:accident.events.fraud}

# ---------- Geo-fencing (sensitive-zone routing) ----------
geofence.sensitive-keywords=${GEOFENCE_KEYWORDS:government,embassy,parliament,airport,military,nuclear,courthouse}

# ---------- Fraud detection (rapid-repeat locations) ----------
# A location reported more than `threshold` times within `window-minutes` is flagged.
fraud.window-minutes=${FRAUD_WINDOW_MINUTES:5}
fraud.threshold=${FRAUD_THRESHOLD:5}

# ---------- Actuator / management ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
# Liveness must track the Kafka Streams topology: if the topology dies, the pod must be
# restarted even though the HTTP server still answers (see KafkaStreamsHealthIndicator).
management.endpoint.health.group.liveness.include=livenessState,kafkaStreams

# ---------- Logging ----------
logging.level.root=INFO
