spring.application.name=ui-app
server.port=${SERVER_PORT:9000}

# Allowed origins for the REST API when the dashboard is hosted as a separate front-end app.
# Default "*" is convenient for dev; pin to the front-end origin(s) in production.
frontend.cors.allowed-origins=${FRONTEND_ORIGINS:*}

spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}

topic.config.source=${SOURCE_TOPIC_NAME:accident.events}
topic.config.sensitive=${SENSITIVE_TOPIC_NAME:accident.events.sensitive}
topic.config.fraud=${FRAUD_TOPIC_NAME:accident.events.fraud}

spring.kafka.producer.key-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.acks=all

# Consumer: read the live event stream to push to the dashboard.
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:ui-app-dashboard}
spring.kafka.consumer.auto-offset-reset=latest
# Avro deserializers are wrapped in ErrorHandlingDeserializer so one poison record is logged
# and skipped instead of stalling the dashboard's listeners forever.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true

spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# ---------- Service discovery (active health-polling) ----------
discovery.poll-interval-ms=${DISCOVERY_POLL_MS:5000}
discovery.timeout-ms=${DISCOVERY_TIMEOUT_MS:2000}
discovery.degraded-latency-ms=${DISCOVERY_DEGRADED_MS:500}
discovery.services[0].name=accident-event-stream
discovery.services[0].url=${ROUTER_URL:http://localhost:8080}
discovery.services[1].name=emergency-service
discovery.services[1].url=${EMERGENCY_URL:http://localhost:18089}
discovery.services[2].name=law-enforcement-service
discovery.services[2].url=${LAW_ENFORCEMENT_URL:http://localhost:28089}
discovery.services[3].name=firerescue-service
discovery.services[3].url=${FIRERESCUE_URL:http://localhost:38089}
discovery.services[4].name=statistics-service
discovery.services[4].url=${STATISTICS_URL:http://localhost:48089}